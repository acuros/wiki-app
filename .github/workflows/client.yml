name: Client CI

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
      - '.nvmrc'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run verify
